name: Profile cards

on:
  schedule:
    - cron: "17 2 * * *"  # daily, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, assets/**, .github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh contribution data
        env:
          # Add a PROFILE_TOKEN secret (PAT with read:user) to count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render cards and commit
        run: |
          python scripts/render_cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json cards README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "Update profile cards"
            git push
          fi
